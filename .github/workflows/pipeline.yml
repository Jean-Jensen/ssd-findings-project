name: BuildTestAndStaticAnalysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
         
        
      - name: Build
        run: dotnet build "server/OnionArchitecture.sln"
        
      - name: Run Tests
        run: dotnet test "server/OnionArchitecture.sln"

  delivery:
    runs-on: ubuntu-latest
    needs: run-tests
    permissions:
      # contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for accurate results of code analysis
      
      # Log in to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the Docker image
      - name: Build and Push Docker image (SSD-Findings-Project)
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/ssd-findings-project"
          IMAGE="${IMAGE,,}"
          docker build \
            -t "${IMAGE}:${{ github.sha }}" \
            -f server/Startup/Dockerfile \
            server
          docker push "${IMAGE}:${{ github.sha }}"