name: BuildTestAndStaticAnalysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
         
      - name: Build
        run: dotnet build "server/OnionArchitecture.sln"
        
      - name: Run Tests
        run: dotnet test "server/OnionArchitecture.sln"

  delivery:
    # this "if" makes the delivery job run only on pushes to the main branch (when the PR is merged and not when it's created)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' 
    runs-on: ubuntu-latest
    needs: run-tests
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for accurate results of code analysis
          
      - name: Application Version
        id: semver
        uses: paulhatch/semantic-version@a8f8f59fd7f0625188492e945240f12d7ad2dca3 # v5.4.0
        with:
          bump_each_commit: true # Automatically bump version for each commit
      
      # Log in to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the Docker image
      - name: Build and Push Docker image (SSD-Findings-Project)
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/ssd-findings-project"
          IMAGE="${IMAGE,,}"
          docker build \
            -t "${IMAGE}:${{ steps.semver.outputs.version }}" \
            -t "${IMAGE}:${{ github.sha }}" \
            -f server/Startup/Dockerfile \
            server
          docker push "${IMAGE}:${{ steps.semver.outputs.version }}"
          docker push "${IMAGE}:${{ github.sha }}"